<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ویرایش</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><div><h1>Railway VPN Panel</h1><small>{{domain or "دامنه Railway هنوز تنظیم نشده"}}</small></div><nav><a href="/">داشبورد</a><a href="/new">+ کانفیگ</a><a href="/subscription">اشتراک</a><a href="/settings">تنظیمات</a><a href="/logout">خروج</a></nav></header>
<section class="card"><h2>ویرایش {{r.name}}</h2><form method="post" class="formgrid">
<label>نام<input name="name" value="{{r.name}}" required></label><label>کاربر<select name="user_id"><option value="0">بدون کاربر</option>{% for u in users %}<option value="{{u.id}}" {% if r.user_id==u.id %}selected{% endif %}>{{u.username}}</option>{% endfor %}</select></label>
<label>Security<select name="security">{% for x in ['none','tls','reality'] %}<option {% if r.security==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label>
<label>Domain/Dest<input name="domain" value="{{r.domain}}"></label><label>SNI<input name="sni" value="{{r.sni}}"></label><label>Fingerprint<input name="fingerprint" value="{{r.fingerprint}}"></label><label>Flow<input name="flow" value="{{r.flow}}"></label><label>Path<input name="path" value="{{r.path}}"></label><label>gRPC Service<input name="service_name" value="{{r.service_name}}"></label><label>XHTTP Mode<input name="xhttp_mode" value="{{r.xhttp_mode}}"></label><label>External Host<input name="external_host" value="{{r.external_host}}"></label><label>External Port<input name="external_port" type="number" value="{{r.external_port}}"></label><label>انقضا<input name="expiry" type="datetime-local" value="{{r.expiry}}"></label><label>سقف GB<input name="quota_gb" value="{{r.quota_gb}}"></label><label>حد IP<input name="ip_limit" value="{{r.ip_limit}}"></label><button class="full">ذخیره و تست Xray</button></form></section></main></body></html>
